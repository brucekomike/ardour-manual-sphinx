name: Deploy Sphinx documentation to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main  # Or your main branch
    paths:
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Checkout converted manual (gh-pages)
        uses: actions/checkout@v4.2.2
        with:
          repository: brucekomike/ardour-manual-converter
          ref: gh-pages
          path: tmp/ardour-manual-conventer

      - name: Checkout preview manual static assets
        uses: actions/checkout@v4.2.2
        with:
          repository: brucekomike/ardour-manual-sphinx-preview
          path: tmp/ardour-manual-sphinx-preview

      - name: Checkout Ardour manual CSS
        uses: actions/checkout@v4.2.2
        with:
          repository: Ardour/manual
          ref: master
          path: tmp/ardour-manual-css
          sparse-checkout: source/css
          sparse-checkout-cone-mode: true

      - name: Replace docs/source with converted manual
        run: |
          cp docs/source/conf.py /tmp/ardour-manual-sphinx-conf.py
          rsync -a --delete --exclude='.git' tmp/ardour-manual-conventer/ docs/source/
          cp /tmp/ardour-manual-sphinx-conf.py docs/source/conf.py

      - name: Add preview static assets
        run: |
          mkdir -p docs/source/_static
          rsync -a tmp/ardour-manual-sphinx-preview/docs/source/_static/ docs/source/_static/
          mkdir -p docs/source/_static/css
          rsync -a --delete tmp/ardour-manual-css/source/css/ docs/source/_static/

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'  # Or your Python version

      - name: Install dependencies
        run: |
          cd docs
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Sphinx documentation
        run: |
          cd docs
          make html
    
      - name: GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
            build_dir: docs/build/html
